name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the client bundle
        run: npm run build
      - name: The committed bundle must match the sources
        run: git diff --exit-code -- lib/client.js
      - name: Activate the bundle against a fake client context
        run: npm run verify
